{% extends "layout.html" %}

{% block content %}
<div class="container mt-5" id="product-page" data-sku="{{ sku }}">
    <div class="row">
        <!-- Vertical Gallery Rail + Main Image -->
        <div class="col-md-7">
            <div class="row g-2">
                <!-- Vertical Thumbnails -->
                <div class="col-2" style="max-height: 600px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;">
                    <div id="thumbnail-rail" class="d-flex flex-column gap-2">
                        <!-- Thumbnails injected by JS -->
                    </div>
                </div>

                <!-- Main Image Gallery -->
                <div class="col-10 position-relative bg-light rounded d-flex align-items-center justify-content-center" style="min-height: 600px;">
                    <button class="btn position-absolute start-0 top-50 translate-middle-y z-3 gallery-nav" id="prev-image" style="background: rgba(255,255,255,0.7); border-radius: 50%; margin-left: 10px;">
                        <i class="fas fa-chevron-left"></i>
                    </button>

                    <img id="main-product-image" src="" alt="Product Image" class="img-fluid rounded shadow-sm" style="max-height: 580px; object-fit: contain;">

                    <button class="btn position-absolute end-0 top-50 translate-middle-y z-3 gallery-nav" id="next-image" style="background: rgba(255,255,255,0.7); border-radius: 50%; margin-right: 10px;">
                        <i class="fas fa-chevron-right"></i>
                    </button>

                    <div class="position-absolute bottom-0 start-50 translate-middle-x mb-3 badge bg-dark opacity-75" id="image-counter">
                        1 / 1
                    </div>
                </div>
            </div>
        </div>

        <!-- Product Info -->
        <div class="col-md-5">
            <div class="ps-md-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted">Home</a></li>
                        <li class="breadcrumb-item"><a href="/shop" class="text-decoration-none text-muted">Shop</a></li>
                        <li class="breadcrumb-item active" id="breadcrumb-category" aria-current="page">...</li>
                    </ol>
                </nav>

                <div class="d-flex gap-2 mb-2" id="tag-container">
                    <!-- Tags injected here -->
                </div>

                <h1 id="product-name" class="fw-bold mb-1" style="font-size: 1.5rem;">Loading...</h1>
                <p id="product-sku-display" class="text-muted small mb-3">SKU: {{ sku }}</p>

                <h2 id="product-price" class="text-primary fw-bold mb-4 h3">$0.00</h2>

                <p id="product-short-description" class="text-secondary mb-4"></p>

                <!-- Variants Selection -->
                <div id="variants-container" class="mb-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase">Color</label>
                        <div id="color-options" class="d-flex flex-wrap gap-2">
                            <!-- Colors injected here -->
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase">Size</label>
                        <div id="size-options" class="d-flex flex-wrap gap-2">
                            <!-- Sizes injected here -->
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button id="add-to-cart-btn" class="btn btn-primary btn-lg py-3 fw-bold shadow-sm">
                        <i class="fas fa-shopping-cart me-2"></i> ADD TO CART
                    </button>
                    <div class="d-flex justify-content-between mt-2 text-muted small">
                        <span><i class="fas fa-truck me-1"></i> Free Shipping</span>
                        <span><i class="fas fa-undo me-1"></i> 30-Day Returns</span>
                    </div>
                </div>

                <hr class="my-5">

                <!-- Accordion for Description and Details -->
                <div class="accordion accordion-flush" id="productInfoAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDescription">
                                <span class="fw-bold">Description</span>
                            </button>
                        </h2>
                        <div id="collapseDescription" class="accordion-collapse collapse show" data-bs-parent="#productInfoAccordion">
                            <div class="accordion-body text-muted" id="product-description">
                                <!-- Description injected here -->
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDetails">
                                <span class="fw-bold">Product Details</span>
                            </button>
                        </h2>
                        <div id="collapseDetails" class="accordion-collapse collapse" data-bs-parent="#productInfoAccordion">
                            <div class="accordion-body text-muted" id="product-details">
                                <!-- Details injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Related Products -->
    <div class="mt-5 pt-5">
        <h3 class="fw-bold mb-4 border-bottom pb-3">Deals on related products</h3>
        <div class="position-relative">
            <div id="related-products-carousel" class="d-flex gap-4 overflow-auto pb-4" style="scrollbar-width: thin; scroll-behavior: smooth;">
                <!-- Related products injected here -->
            </div>
        </div>
    </div>

    <!-- Proposed Products -->
    <div class="mt-5 pt-5 mb-5">
        <h3 class="fw-bold mb-4 border-bottom pb-3">Similar Designs</h3>
        <div class="position-relative">
            <div id="proposed-products-carousel" class="d-flex gap-4 overflow-auto pb-4" style="scrollbar-width: thin; scroll-behavior: smooth;">
                <!-- Proposed products injected here -->
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/product.js') }}"></script>
{% endblock %}
